[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnioperator"
version = "0.2.0"
description = "Verified action execution and reproducible real-file workflow experiments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "OmniOperator Contributors"}]
keywords = ["agent", "os-automation", "llm", "guardrails", "computer-use"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
openai = ["openai>=1.0"]
evaluation = ["pandas>=2.2,<4"]

[tool.setuptools.packages.find]
include = ["omnioperator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
